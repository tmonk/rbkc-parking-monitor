title: Parking Monitor
views:
  - title: Parking
    path: parking
    theme: Backend-selected
    badges: []
    cards:
      # Location header (display + edit in one stack)
      - type: vertical-stack
        cards:
          - type: entities
            title: Car Location
            show_header_toggle: false
            entities:
              - entity: input_text.rbkc_parking_location
                name: Car Location (auto-saves)
                icon: mdi:car-connected

          # Main Alert Card - Active Danger
          - type: conditional
            conditions:
              - entity: binary_sensor.rbkc_parking_monitor_car_in_suspended_bay
                state: 'on'
            card:
              type: markdown
              content: |
                <div style="background:linear-gradient(135deg,#ff6b6b 0%,#ee5a6f 100%);color:white;border-radius:12px;padding:24px;box-shadow:0 8px 16px rgba(255,107,107,0.3);margin:-16px;">

                <h2 style="margin:0 0 8px 0;text-align:center;font-size:1.8em;">🚨 MOVE CAR IMMEDIATELY</h2>
                <p style="margin:0 0 20px 0;text-align:center;opacity:0.9;font-size:0.95em;">Active suspension at your location</p>

                <h3 style="margin:16px 0 8px 0;font-size:1.2em;">📍 Location</h3>
                <p style="margin:0 0 16px 0;font-size:1.1em;font-weight:bold;">{{ state_attr('device_tracker.rbkc_parking_monitor_car', 'location_name') }}</p>

                <h3 style="margin:16px 0 8px 0;font-size:1.2em;">⚠️ Active Suspensions</h3>
                <p style="margin:0;font-size:1em;line-height:1.6;">{{ state_attr('binary_sensor.rbkc_parking_monitor_car_in_suspended_bay', 'active_suspensions') }}</p>

                </div>

          # Upcoming Warning Card
          - type: conditional
            conditions:
              - entity: binary_sensor.rbkc_parking_monitor_car_in_suspended_bay
                state: 'off'
              - entity: binary_sensor.rbkc_parking_monitor_car_in_suspended_bay
                attribute: upcoming_risk
                state_not: false
            card:
              type: markdown
              content: |
                <div style="background:linear-gradient(135deg,#ffd93d 0%,#f9ca24 100%);border-radius:12px;padding:20px;box-shadow:0 4px 12px rgba(255,217,61,0.3);margin:-16px;">

                <h2 style="margin:0 0 16px 0;font-size:1.5em;">⚠️ Upcoming This Week</h2>

                <p style="margin:0;font-size:1em;line-height:1.6;">Suspensions starting in the next 7 days:</p>

                <p style="margin:12px 0 0 0;font-size:1em;line-height:1.6;">{{ state_attr('binary_sensor.rbkc_parking_monitor_car_in_suspended_bay', 'upcoming_suspensions') }}</p>

                </div>

          # All Clear Card
          - type: conditional
            conditions:
              - entity: binary_sensor.rbkc_parking_monitor_car_in_suspended_bay
                state: 'off'
              - entity: binary_sensor.rbkc_parking_monitor_car_in_suspended_bay
                attribute: upcoming_risk
                state: false
            card:
              type: markdown
              content: |
                <div style="background:linear-gradient(135deg,#6bcf7f 0%,#4cd964 100%);color:white;border-radius:12px;padding:20px;box-shadow:0 4px 12px rgba(107,207,127,0.3);margin:-16px;">

                <h2 style="margin:0 0 16px 0;font-size:1.5em;">✅ All Clear</h2>

                <p style="margin:0;font-size:1em;">No active or upcoming suspensions at your location.</p>

                </div>

      # Interactive Map
      - type: map
        title: 🗺️ Active Suspensions Map
        aspect_ratio: '16:9'
        default_zoom: 16
        dark_mode: auto
        entities:
          - entity: device_tracker.rbkc_parking_monitor_car
            name: My Car
            color: blue
          - entity: device_tracker.rbkc_parking_monitor_suspension_1
          - entity: device_tracker.rbkc_parking_monitor_suspension_2
          - entity: device_tracker.rbkc_parking_monitor_suspension_3
          - entity: device_tracker.rbkc_parking_monitor_suspension_4
          - entity: device_tracker.rbkc_parking_monitor_suspension_5

      # All Suspensions List
      - type: markdown
        title: 📋 All Suspensions
        entity_id:
          - binary_sensor.rbkc_parking_monitor_car_in_suspended_bay
        content: |
          {% set status = state_attr('binary_sensor.rbkc_parking_monitor_car_in_suspended_bay', 'last_status') %}

          {% if status == 'Cache Empty' %}

          <div style="background:#fff3cd;border-left:4px solid #ffc107;padding:12px;margin:0 0 16px 0;border-radius:4px;">
          <p style="margin:0;color:#856404;"><strong>⚠️ System Status:</strong> {{ status }}</p>
          <p style="margin:8px 0 0 0;color:#856404;font-size:0.9em;"><em>To fix: Forward a suspension email to yourself to populate the cache.</em></p>
          </div>

          {% elif status and status not in ['OK', 'Script Completed'] %}

          <div style="background:#f8d7da;border-left:4px solid #dc3545;padding:12px;margin:0 0 16px 0;border-radius:4px;">
          <p style="margin:0;color:#721c24;"><strong>⚠️ System Status:</strong> {{ status }}</p>
          </div>

          {% endif %}

          <h3 style="margin:16px 0 12px 0;font-size:1.2em;">🔴 Active Today</h3>

          {% set active = state_attr('binary_sensor.rbkc_parking_monitor_car_in_suspended_bay', 'all_active_suspensions') | default([], true) %}
          {% if active and active|length > 0 %}
            {{ active | join('<br>') }}
          {% else %}
            None
          {% endif %}

          <hr style="border:none;border-top:1px solid #ddd;margin:20px 0;">

          <h3 style="margin:16px 0 12px 0;font-size:1.2em;">🔵 Future Suspensions</h3>

          {% set upcoming = state_attr('binary_sensor.rbkc_parking_monitor_car_in_suspended_bay', 'all_upcoming_suspensions') | default([], true) %}
          {% if upcoming and upcoming|length > 0 %}
            {{ upcoming | join('<br>') }}
          {% else %}
            None
          {% endif %}

          <hr style="border:none;border-top:1px solid #ddd;margin:20px 0;">

          <p style="text-align:center;color:#aaa;font-size:8px;margin:8px 0 0 0;padding:0;">
          {% set email_date = state_attr('binary_sensor.rbkc_parking_monitor_car_in_suspended_bay', 'email_data_date') | default('Unknown') %}
          {% set last_checked = state_attr('binary_sensor.rbkc_parking_monitor_car_in_suspended_bay', 'last_checked') | default('Never') %}
          📧 Email Data From: {{ email_date }} • 🔄 Last Checked: {{ last_checked }}
          </p>

          <p style="text-align:center;color:#aaa;font-size:0.85em;margin:16px 0 0 0;">
          💡 To change car location or settings, go to Settings → Devices & Services → RBKC Parking Monitor → Configure
          </p>
