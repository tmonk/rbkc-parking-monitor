check_parking:
  name: Check Parking
  description: Manually trigger a parking suspension check
  fields:
    email_body:
      name: Email Body
      description: Optional email body text to process. If not provided, uses cached email.
      example: "Subject: Parking Suspensions Email Alert..."
      required: false
      selector:
        text:
          multiline: true

set_car_location:
  name: Set Car Location
  description: Update the monitored car location and refresh the monitor.
  fields:
    car_location:
      name: Car Location
      description: Address or area to monitor for suspensions.
      example: "W8 7NX"
      required: true
      selector:
        text:
          multiline: false
    entry_id:
      name: Entry ID
      description: Optional config entry ID if you have multiple RBKC Parking Monitor entries.
      required: false
      selector:
        text:
          multiline: false
